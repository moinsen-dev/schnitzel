# =============================================================================
# FoodieAI - AI-Powered Restaurant Ordering App
# =============================================================================
# A comprehensive Schnitzel schema example demonstrating ALL framework features.
# This schema defines a multi-restaurant food ordering platform with AI chat,
# real-time order tracking, and smart recommendations.
#
# Schnitzel Framework Example | Moinsen Development
# =============================================================================

schnitzel: "1.0"

meta:
  name: "FoodieAI"
  org: "com.moinsen.foodieai"
  description: "AI-powered restaurant ordering with natural language chat and real-time tracking"

# =============================================================================
# MODELS - Domain entities shared between Flutter and FastAPI
# =============================================================================

models:
  # ---------------------------------------------------------------------------
  # Restaurant & Menu Models
  # ---------------------------------------------------------------------------
  Restaurant:
    description: "A restaurant or food vendor in the marketplace"
    fields:
      id: { type: uuid, primary: true }
      name: { type: string, min: 1, max: 100 }
      slug: { type: string, unique: true }
      description: { type: string, max: 500 }
      cuisine_type: { type: list<string> }  # ["Italian", "Pizza", "Vegan-friendly"]
      logo_url: { type: string, optional: true }
      cover_image_url: { type: string, optional: true }
      address: { type: string }
      latitude: { type: float }
      longitude: { type: float }
      rating: { type: float, default: 0.0 }
      review_count: { type: int, default: 0 }
      is_open: { type: bool, default: true }
      opening_hours: { type: json }  # {"mon": {"open": "09:00", "close": "22:00"}, ...}
      minimum_order: { type: float, default: 0.0 }
      delivery_fee: { type: float, default: 0.0 }
      estimated_delivery_minutes: { type: int, default: 30 }
      created_at: { type: datetime, auto: create }
      updated_at: { type: datetime, auto: update }
    relations:
      menu_categories: { type: hasMany, model: Category }
      reviews: { type: hasMany, model: Review }
    indexes:
      - [slug]
      - [cuisine_type]
      - [is_open, rating]

  Category:
    description: "Menu category within a restaurant"
    fields:
      id: { type: uuid, primary: true }
      name: { type: string, max: 50 }
      description: { type: string, max: 200, optional: true }
      sort_order: { type: int, default: 0 }
      is_available: { type: bool, default: true }
    relations:
      restaurant: { type: belongsTo, model: Restaurant }
      items: { type: hasMany, model: MenuItem }

  MenuItem:
    description: "A dish or product available for ordering"
    fields:
      id: { type: uuid, primary: true }
      name: { type: string, max: 100 }
      description: { type: string, max: 500 }
      price: { type: float }
      image_url: { type: string, optional: true }
      is_available: { type: bool, default: true }
      is_popular: { type: bool, default: false }
      calories: { type: int, optional: true }
      prep_time_minutes: { type: int, default: 15 }
      dietary_tags: { type: list<string> }  # ["vegetarian", "gluten-free", "spicy"]
      allergens: { type: list<string> }     # ["nuts", "dairy", "shellfish"]
      embedding: { type: vector, dimensions: 1536 }  # For AI search
    relations:
      category: { type: belongsTo, model: Category }
      modifiers: { type: hasMany, model: Modifier }
    indexes:
      - [is_available, is_popular]

  Modifier:
    description: "Optional add-ons or customizations for menu items"
    fields:
      id: { type: uuid, primary: true }
      name: { type: string, max: 50 }
      price_adjustment: { type: float, default: 0.0 }
      is_default: { type: bool, default: false }
      max_selections: { type: int, default: 1 }
      modifier_group: { type: string }  # "Size", "Toppings", "Extras"
    relations:
      menu_item: { type: belongsTo, model: MenuItem }

  # ---------------------------------------------------------------------------
  # User Models
  # ---------------------------------------------------------------------------
  User:
    description: "Application user (customer, staff, or admin)"
    fields:
      id: { type: uuid, primary: true }
      email: { type: string, unique: true, format: email }
      phone: { type: string, optional: true }
      name: { type: string, max: 100 }
      avatar_url: { type: string, optional: true }
      role: { type: enum, values: [customer, restaurant_staff, kitchen, delivery, admin], default: customer }
      preferred_language: { type: string, default: "en" }
      dietary_preferences: { type: list<string> }  # ["vegetarian", "no-nuts"]
      created_at: { type: datetime, auto: create }
      updated_at: { type: datetime, auto: update }
    relations:
      addresses: { type: hasMany, model: Address }
      payment_methods: { type: hasMany, model: PaymentMethod }
      orders: { type: hasMany, model: Order }
      reviews: { type: hasMany, model: Review }
    indexes:
      - [email]
      - [role]

  Address:
    description: "Delivery address for a user"
    fields:
      id: { type: uuid, primary: true }
      label: { type: string, max: 50 }  # "Home", "Work"
      street: { type: string }
      city: { type: string }
      postal_code: { type: string }
      country: { type: string, default: "DE" }
      latitude: { type: float }
      longitude: { type: float }
      delivery_instructions: { type: string, max: 200, optional: true }
      is_default: { type: bool, default: false }
    relations:
      user: { type: belongsTo, model: User }

  PaymentMethod:
    description: "Stored payment method (tokenized)"
    fields:
      id: { type: uuid, primary: true }
      type: { type: enum, values: [card, paypal, apple_pay, google_pay] }
      last_four: { type: string, max: 4 }
      brand: { type: string, optional: true }  # "visa", "mastercard"
      stripe_payment_method_id: { type: string }
      is_default: { type: bool, default: false }
      expires_at: { type: datetime, optional: true }
    relations:
      user: { type: belongsTo, model: User }

  # ---------------------------------------------------------------------------
  # Order Models
  # ---------------------------------------------------------------------------
  Order:
    description: "A customer order"
    fields:
      id: { type: uuid, primary: true }
      order_number: { type: string, unique: true }  # Human-readable: "FD-2025-001234"
      status: { type: enum, values: [pending, confirmed, preparing, ready, out_for_delivery, delivered, cancelled], default: pending }
      subtotal: { type: float }
      delivery_fee: { type: float }
      tax: { type: float }
      tip: { type: float, default: 0.0 }
      total: { type: float }
      payment_status: { type: enum, values: [pending, paid, refunded, failed], default: pending }
      payment_intent_id: { type: string, optional: true }  # Stripe
      delivery_address: { type: json }  # Snapshot of address at order time
      special_instructions: { type: string, max: 500, optional: true }
      estimated_delivery_at: { type: datetime, optional: true }
      delivered_at: { type: datetime, optional: true }
      created_at: { type: datetime, auto: create }
      updated_at: { type: datetime, auto: update }
    relations:
      user: { type: belongsTo, model: User }
      restaurant: { type: belongsTo, model: Restaurant }
      items: { type: hasMany, model: OrderItem }
    indexes:
      - [order_number]
      - [user_id, created_at]
      - [restaurant_id, status]
      - [status, created_at]

  OrderItem:
    description: "A line item in an order"
    fields:
      id: { type: uuid, primary: true }
      quantity: { type: int, default: 1 }
      unit_price: { type: float }
      total_price: { type: float }
      selected_modifiers: { type: json }  # Snapshot: [{"name": "Large", "price": 2.00}]
      special_requests: { type: string, max: 200, optional: true }
    relations:
      order: { type: belongsTo, model: Order }
      menu_item: { type: belongsTo, model: MenuItem }

  # ---------------------------------------------------------------------------
  # AI Chat Models
  # ---------------------------------------------------------------------------
  Conversation:
    description: "AI chat conversation for ordering assistance"
    fields:
      id: { type: uuid, primary: true }
      title: { type: string, max: 100, optional: true }
      context: { type: json }  # Conversation state, cart preview, etc.
      created_at: { type: datetime, auto: create }
      updated_at: { type: datetime, auto: update }
    relations:
      user: { type: belongsTo, model: User }
      messages: { type: hasMany, model: ChatMessage }

  ChatMessage:
    description: "A message in an AI conversation"
    fields:
      id: { type: uuid, primary: true }
      role: { type: enum, values: [user, assistant, system] }
      content: { type: string }
      tool_calls: { type: json, optional: true }  # Function calls made by AI
      created_at: { type: datetime, auto: create }
    relations:
      conversation: { type: belongsTo, model: Conversation }

  # ---------------------------------------------------------------------------
  # Review Models
  # ---------------------------------------------------------------------------
  Review:
    description: "Customer review for a restaurant"
    fields:
      id: { type: uuid, primary: true }
      rating: { type: int }  # 1-5
      title: { type: string, max: 100, optional: true }
      comment: { type: string, max: 1000, optional: true }
      is_verified_purchase: { type: bool, default: false }
      created_at: { type: datetime, auto: create }
    relations:
      user: { type: belongsTo, model: User }
      restaurant: { type: belongsTo, model: Restaurant }
      order: { type: belongsTo, model: Order, optional: true }

# =============================================================================
# ENDPOINTS - REST API definitions
# =============================================================================

endpoints:
  # ---------------------------------------------------------------------------
  # Restaurant & Menu Endpoints
  # ---------------------------------------------------------------------------
  /restaurants:
    GET:
      name: listRestaurants
      description: "Browse restaurants with filters"
      query:
        page: { type: int, default: 1 }
        limit: { type: int, default: 20, max: 50 }
        cuisine: { type: string, optional: true }
        is_open: { type: bool, optional: true }
        sort_by: { type: enum, values: [rating, distance, delivery_time], default: rating }
        latitude: { type: float, optional: true }
        longitude: { type: float, optional: true }
      response:
        200: { type: PaginatedResponse<Restaurant> }

  /restaurants/{slug}:
    params:
      slug: { type: string }
    GET:
      name: getRestaurant
      description: "Get restaurant details with full menu"
      response:
        200: { type: RestaurantWithMenu }
        404: { type: ErrorResponse }

  /menu/search:
    GET:
      name: searchMenu
      description: "AI-powered semantic search across all menus"
      query:
        q: { type: string }  # "something spicy and vegetarian"
        restaurant_id: { type: uuid, optional: true }
        dietary_tags: { type: list<string>, optional: true }
        max_price: { type: float, optional: true }
        limit: { type: int, default: 10 }
      response:
        200: { type: list<MenuItemSearchResult> }

  # ---------------------------------------------------------------------------
  # Order Endpoints
  # ---------------------------------------------------------------------------
  /orders:
    GET:
      name: listOrders
      description: "Get user's order history"
      auth: required
      query:
        page: { type: int, default: 1 }
        limit: { type: int, default: 20 }
        status: { type: string, optional: true }
      response:
        200: { type: PaginatedResponse<Order> }

    POST:
      name: createOrder
      description: "Place a new order"
      auth: required
      body: CreateOrderRequest
      response:
        201: { type: Order }
        400: { type: ValidationError }
        402: { type: PaymentError }

  /orders/{id}:
    params:
      id: { type: uuid }
    GET:
      name: getOrder
      description: "Get order details"
      auth: required
      response:
        200: { type: OrderWithItems }
        404: { type: ErrorResponse }

  /orders/{id}/status:
    params:
      id: { type: uuid }
    PATCH:
      name: updateOrderStatus
      description: "Update order status (staff only)"
      auth: required
      roles: [restaurant_staff, kitchen, delivery, admin]
      body:
        status: { type: enum, values: [confirmed, preparing, ready, out_for_delivery, delivered, cancelled] }
        estimated_minutes: { type: int, optional: true }
      response:
        200: { type: Order }
        403: { type: ErrorResponse }

  /orders/{id}/cancel:
    params:
      id: { type: uuid }
    POST:
      name: cancelOrder
      description: "Cancel an order (if allowed)"
      auth: required
      body:
        reason: { type: string, optional: true }
      response:
        200: { type: Order }
        400: { type: ErrorResponse }  # Cannot cancel if already preparing

  # ---------------------------------------------------------------------------
  # User Endpoints
  # ---------------------------------------------------------------------------
  /users/me:
    GET:
      name: getCurrentUser
      description: "Get current user profile"
      auth: required
      response:
        200: { type: User }

    PATCH:
      name: updateCurrentUser
      description: "Update user profile"
      auth: required
      body: UpdateUserRequest
      response:
        200: { type: User }

  /users/me/addresses:
    GET:
      name: listAddresses
      auth: required
      response:
        200: { type: list<Address> }

    POST:
      name: createAddress
      auth: required
      body: CreateAddressRequest
      response:
        201: { type: Address }

  # ---------------------------------------------------------------------------
  # AI Chat Endpoints
  # ---------------------------------------------------------------------------
  /chat/conversations:
    POST:
      name: startConversation
      description: "Start a new AI ordering conversation"
      auth: required
      body:
        restaurant_id: { type: uuid, optional: true }
      response:
        201: { type: Conversation }

  /chat/conversations/{id}/messages:
    params:
      id: { type: uuid }
    POST:
      name: sendMessage
      description: "Send a message (response via SSE stream)"
      auth: required
      body:
        content: { type: string }
      response:
        202: { type: MessageAccepted }

  # ---------------------------------------------------------------------------
  # Review Endpoints
  # ---------------------------------------------------------------------------
  /restaurants/{slug}/reviews:
    params:
      slug: { type: string }
    GET:
      name: listReviews
      query:
        page: { type: int, default: 1 }
        limit: { type: int, default: 20 }
      response:
        200: { type: PaginatedResponse<Review> }

    POST:
      name: createReview
      auth: required
      body: CreateReviewRequest
      response:
        201: { type: Review }

# =============================================================================
# STREAMS - Real-time SSE/WebSocket connections
# =============================================================================

streams:
  /orders/{id}/track:
    name: trackOrder
    description: "Real-time order status and location updates"
    type: sse
    auth: required
    params:
      id: { type: uuid }
    chunks:
      status: { type: string }
      estimated_minutes: { type: int, optional: true }
      driver_location: { type: json, optional: true }  # {"lat": 52.52, "lng": 13.40}
      message: { type: string, optional: true }

  /chat/{conversation_id}/stream:
    name: chatStream
    description: "Stream AI assistant responses"
    type: sse
    auth: required
    params:
      conversation_id: { type: uuid }
    chunks:
      delta: { type: string }           # Text token
      tool_call: { type: json, optional: true }  # {"name": "add_to_cart", "args": {...}}
      done: { type: bool }
      message_id: { type: uuid, optional: true }

  /kitchen/{restaurant_id}/orders:
    name: kitchenOrderFeed
    description: "Live feed of incoming orders for kitchen display"
    type: websocket
    auth: required
    roles: [restaurant_staff, kitchen, admin]
    params:
      restaurant_id: { type: uuid }
    chunks:
      event_type: { type: enum, values: [new_order, status_update, cancelled] }
      order: { type: json }

# =============================================================================
# EVENTS - Push notifications to clients
# =============================================================================

events:
  order.placed:
    description: "New order placed"
    payload:
      order_id: { type: uuid }
      order_number: { type: string }
      restaurant_id: { type: uuid }
      total: { type: float }
    channels: [websocket, redis-pubsub]

  order.status_changed:
    description: "Order status updated"
    payload:
      order_id: { type: uuid }
      order_number: { type: string }
      old_status: { type: string }
      new_status: { type: string }
      estimated_minutes: { type: int, optional: true }
    channels: [websocket, push]

  order.ready:
    description: "Order ready for pickup/delivery"
    payload:
      order_id: { type: uuid }
      order_number: { type: string }
    channels: [websocket, push]

  payment.processed:
    description: "Payment successfully processed"
    payload:
      order_id: { type: uuid }
      amount: { type: float }
      payment_method: { type: string }
    channels: [websocket]

  payment.failed:
    description: "Payment failed"
    payload:
      order_id: { type: uuid }
      error_code: { type: string }
      message: { type: string }
    channels: [websocket, push]

# =============================================================================
# JOBS - Scheduled background tasks
# =============================================================================

jobs:
  sync_menu_embeddings:
    description: "Update vector embeddings for menu items (AI search)"
    schedule: "0 3 * * *"  # Daily at 3 AM
    timeout: 3600
    retry:
      max_attempts: 3
      backoff: exponential

  send_daily_promotions:
    description: "Send personalized deal notifications"
    schedule: "0 11 * * *"  # Daily at 11 AM
    timeout: 1800

  cleanup_abandoned_carts:
    description: "Remove carts inactive for 24+ hours"
    schedule: "0 */6 * * *"  # Every 6 hours
    timeout: 300

  recalculate_restaurant_ratings:
    description: "Update average ratings from reviews"
    schedule: "0 4 * * *"  # Daily at 4 AM
    timeout: 600

# =============================================================================
# AUTHENTICATION & AUTHORIZATION
# =============================================================================

auth:
  providers:
    - email_password
    - magic_link
    - google
    - apple

  session:
    type: jwt
    access_expiry: 900       # 15 minutes
    refresh_expiry: 2592000  # 30 days
    refresh: true

  mfa: optional

roles:
  admin:
    permissions: ["*"]

  restaurant_staff:
    permissions:
      - restaurants:read:own
      - restaurants:update:own
      - orders:read:own
      - orders:update:own
      - menu:*:own

  kitchen:
    permissions:
      - orders:read:own
      - orders:update:own

  delivery:
    permissions:
      - orders:read:assigned
      - orders:update:assigned

  customer:
    permissions:
      - restaurants:read
      - menu:read
      - orders:create
      - orders:read:own
      - orders:cancel:own
      - reviews:create
      - reviews:read
      - chat:*:own

# =============================================================================
# SERVICES - Infrastructure configuration
# =============================================================================

services:
  database:
    type: postgres
    version: "16"
    extensions: [pgvector, uuid-ossp, postgis]

  cache:
    type: redis
    version: "7"
    features: [pubsub, streams]

  vectors:
    type: qdrant
    collections:
      - name: menu_items
        dimensions: 1536
        distance: cosine

  jobs:
    type: temporal

# =============================================================================
# INTEGRATIONS - Third-party services
# =============================================================================

storage:
  provider: s3
  buckets:
    restaurant-images:
      public: true
      max_size: 10mb
      allowed_types: [image/jpeg, image/png, image/webp]
    user-avatars:
      public: true
      max_size: 5mb
      allowed_types: [image/jpeg, image/png]

notifications:
  push:
    fcm: true
    apns: true
  email:
    provider: resend
    templates: true

payments:
  provider: stripe
  webhooks: true

i18n:
  default_locale: en
  supported: [en, de, es, fr]
  fallback: en

# =============================================================================
# ERROR CONTRACTS
# =============================================================================

errors:
  format: rfc7807
  codes:
    ORDER_NOT_FOUND:
      status: 404
      message: "Order not found"
    ORDER_CANNOT_CANCEL:
      status: 400
      message: "Order cannot be cancelled at this stage"
    RESTAURANT_CLOSED:
      status: 400
      message: "Restaurant is currently closed"
    MINIMUM_ORDER_NOT_MET:
      status: 400
      message: "Order does not meet minimum amount"
    PAYMENT_FAILED:
      status: 402
      message: "Payment could not be processed"
    DELIVERY_ADDRESS_OUT_OF_RANGE:
      status: 400
      message: "Delivery address is outside the delivery area"

# =============================================================================
# ENVIRONMENTS
# =============================================================================

environments:
  dev:
    api_url: "http://localhost:${PORT_API}"
    bundle_id: "dev.moinsen.foodieai.dev"
    application_id: "dev.moinsen.foodieai.dev"
    app_name: "FoodieAI Dev"
    debug: true
    features: [debug_panel, mock_payments, seed_data]
    secrets: .env.dev

  staging:
    api_url: "https://staging-api.foodieai.app"
    bundle_id: "dev.moinsen.foodieai.staging"
    application_id: "dev.moinsen.foodieai.staging"
    app_name: "FoodieAI Staging"
    debug: false
    features: [analytics, error_tracking]
    secrets: .env.staging

  production:
    api_url: "https://api.foodieai.app"
    bundle_id: "dev.moinsen.foodieai"
    application_id: "dev.moinsen.foodieai"
    app_name: "FoodieAI"
    debug: false
    features: [analytics, error_tracking, rate_limiting]
    secrets: .env.production

# =============================================================================
# OBSERVABILITY
# =============================================================================

observability:
  logging:
    format: json
    level: info
  error_tracking:
    provider: sentry
  metrics:
    enabled: true
    endpoint: /metrics

# =============================================================================
# FEATURE PACKAGES
# =============================================================================

features:
  restaurants:
    description: "Restaurant and menu management"
    flutter_package: true
    models: [Restaurant, Category, MenuItem, Modifier]
    exports: [Restaurant, MenuItem]

  orders:
    description: "Order management and tracking"
    flutter_package: true
    models: [Order, OrderItem]
    depends_on: [restaurants, auth]
    exports: [Order]

  chat:
    description: "AI ordering assistant"
    flutter_package: true
    models: [Conversation, ChatMessage]
    depends_on: [auth, restaurants]

  reviews:
    description: "Restaurant reviews and ratings"
    flutter_package: true
    models: [Review]
    depends_on: [auth, restaurants, orders]

app:
  shell: material
  features: [restaurants, orders, chat, reviews]
