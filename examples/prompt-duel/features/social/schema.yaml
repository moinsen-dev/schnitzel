# =============================================================================
# PROMPT DUEL - Social Feature
# =============================================================================
# Leaderboards, spectating, friends, seasons, achievements
# =============================================================================

feature:
  name: "Social"
  version: "1.0.0"
  description: "Leaderboards, spectating, friends, seasons"
  docs: docs/features/social.md

# =============================================================================
# MODELS
# =============================================================================

models:
  Season:
    description: "Competitive season with rankings reset"
    fields:
      id: { type: uuid, primary: true }
      name: { type: string }  # "Season 1", "Winter 2025", etc.
      status: { type: enum, values: [upcoming, active, ended, archived], default: upcoming }
      start_date: { type: datetime }
      end_date: { type: datetime }
      rewards: { type: json, optional: true }  # Rewards for top players
      created_at: { type: datetime, auto: create }
      activated_at: { type: datetime, optional: true }
      ended_at: { type: datetime, optional: true }
    indexes:
      - [status]
      - [start_date]

    # =========================================================================
    # STATE MACHINE - Season Lifecycle
    # =========================================================================
    state_machine:
      field: status
      initial: upcoming

      states:
        upcoming:
          description: "Season scheduled but not yet started"

        active:
          description: "Season is currently running"
          on_enter: |
            set activated_at = now()
            reset_all_rankings()
            emit season.started

        ended:
          description: "Season has concluded, rewards pending"
          on_enter: |
            set ended_at = now()
            calculate_final_rankings()
            emit season.ended

        archived:
          description: "Season fully processed and archived"
          final: true
          on_enter: "archive_season_data()"

      transitions:
        activate:
          description: "Start the season"
          from: upcoming
          to: active
          guard: "now() >= start_date"
          roles: [admin, system]
          action: "create_leaderboard_entries_for_all_players()"

        end:
          description: "End the season"
          from: active
          to: ended
          guard: "now() >= end_date"
          roles: [admin, system]
          action: "lock_rankings()"

        distribute_rewards:
          description: "Distribute rewards and archive"
          from: ended
          to: archived
          roles: [admin]
          guard: "rewards_distributed == true"
          action: |
            notify_top_players()
            grant_season_achievements()

    # =========================================================================
    # COMPUTED FIELDS
    # =========================================================================
    computed:
      is_active:
        type: bool
        virtual: true
        formula: "status == 'active'"

      days_remaining:
        type: int
        virtual: true
        formula: "max(0, days_between(now(), end_date))"

      total_duration_days:
        type: int
        virtual: true
        formula: "days_between(start_date, end_date)"

      progress_percentage:
        type: float
        virtual: true
        formula: |
          if status == 'upcoming': 0
          elif status == 'active':
            min(100, (days_between(start_date, now()) / total_duration_days) * 100)
          else: 100

    # =========================================================================
    # BUSINESS RULES
    # =========================================================================
    constraints:
      - name: valid_date_range
        check: "end_date > start_date"
        message: "Season end date must be after start date"

      - name: no_overlapping_seasons
        check: |
          not exists(Season, s =>
            s.id != id
            and s.status in ['upcoming', 'active']
            and date_ranges_overlap(start_date, end_date, s.start_date, s.end_date)
          )
        message: "Seasons cannot overlap"

    hooks:
      before_create:
        - name: validate_future_start
          check: "start_date > now()"
          error: "Season must start in the future"

  LeaderboardEntry:
    description: "Player ranking in a season"
    fields:
      id: { type: uuid, primary: true }
      rank: { type: int }
      elo_rating: { type: int }
      games_played: { type: int, default: 0 }
      games_won: { type: int, default: 0 }
      win_rate: { type: float, default: 0 }
      style_points: { type: int, default: 0 }
      peak_elo: { type: int, default: 1000 }
      tier: { type: enum, values: [bronze, silver, gold, platinum, diamond, master, grandmaster] }
      updated_at: { type: datetime, auto: update }
    relations:
      season: { type: belongsTo, model: Season }
      player: { type: belongsTo, model: Player }
    indexes:
      - [season_id, rank]
      - [season_id, elo_rating]
      - [tier]

  Friendship:
    description: "Friendship between players"
    fields:
      id: { type: uuid, primary: true }
      status: { type: enum, values: [pending, accepted, declined, blocked, removed] }
      created_at: { type: datetime, auto: create }
      accepted_at: { type: datetime, optional: true }
      blocked_at: { type: datetime, optional: true }
      blocked_by: { type: uuid, optional: true }  # Which player blocked
    relations:
      requester: { type: belongsTo, model: Player }
      recipient: { type: belongsTo, model: Player }
    indexes:
      - [status]
      - [requester_id, recipient_id]

    # =========================================================================
    # STATE MACHINE - Friendship Lifecycle
    # =========================================================================
    state_machine:
      field: status
      initial: pending

      states:
        pending:
          description: "Friend request sent, awaiting response"
          timeout:
            duration: 604800  # 7 days
            transition: declined
            message: "Friend request expired"

        accepted:
          description: "Players are now friends"
          on_enter: |
            set accepted_at = now()
            emit friend.request_accepted

        declined:
          description: "Friend request was declined"
          final: true

        blocked:
          description: "One player has blocked the other"
          on_enter: "set blocked_at = now()"

        removed:
          description: "Friendship was removed by one party"
          final: true

      transitions:
        accept:
          description: "Accept the friend request"
          from: pending
          to: accepted
          roles: [recipient]
          action: |
            emit friend.request_accepted to requester
            increment requester.friends_count
            increment recipient.friends_count

        decline:
          description: "Decline the friend request"
          from: pending
          to: declined
          roles: [recipient]

        cancel:
          description: "Cancel sent friend request"
          from: pending
          to: removed
          roles: [requester]

        unfriend:
          description: "Remove an existing friendship"
          from: accepted
          to: removed
          roles: [requester, recipient]
          action: |
            decrement requester.friends_count
            decrement recipient.friends_count

        block:
          description: "Block the other player"
          from: [pending, accepted]
          to: blocked
          roles: [requester, recipient]
          action: |
            set blocked_by = current_user.id
            if previous_status == 'accepted':
              decrement requester.friends_count
              decrement recipient.friends_count

        unblock:
          description: "Unblock a blocked player"
          from: blocked
          to: removed
          roles: [blocker]
          guard: "blocked_by == current_user.id"

    # =========================================================================
    # COMPUTED FIELDS
    # =========================================================================
    computed:
      is_mutual:
        type: bool
        virtual: true
        formula: "status == 'accepted'"

      other_player:
        type: uuid
        virtual: true
        formula: |
          if current_user.id == requester_id:
            recipient_id
          else:
            requester_id

      can_accept:
        type: bool
        virtual: true
        formula: "status == 'pending' and current_user.id == recipient_id"

    # =========================================================================
    # BUSINESS RULES
    # =========================================================================
    constraints:
      - name: no_self_friendship
        check: "requester_id != recipient_id"
        message: "Cannot send friend request to yourself"

      - name: no_duplicate_requests
        check: |
          not exists(Friendship, f =>
            f.id != id
            and f.status in ['pending', 'accepted']
            and (
              (f.requester_id == requester_id and f.recipient_id == recipient_id)
              or (f.requester_id == recipient_id and f.recipient_id == requester_id)
            )
          )
        message: "A friendship or pending request already exists"

      - name: not_blocked
        check: |
          not exists(Friendship, f =>
            f.status == 'blocked'
            and (
              (f.requester_id == requester_id and f.recipient_id == recipient_id)
              or (f.requester_id == recipient_id and f.recipient_id == requester_id)
            )
          )
        message: "Cannot send request to blocked player"

    hooks:
      after_create:
        - name: notify_recipient
          action: |
            emit friend.request_received to recipient with {
              requester_id: requester_id,
              requester_name: requester.display_name
            }

  SpectatorSession:
    description: "A player spectating a match"
    fields:
      id: { type: uuid, primary: true }
      joined_at: { type: datetime, auto: create }
      left_at: { type: datetime, optional: true }
    relations:
      match: { type: belongsTo, model: Match }
      spectator: { type: belongsTo, model: Player }

  Achievement:
    description: "Unlockable achievement"
    fields:
      id: { type: uuid, primary: true }
      name: { type: string }
      description: { type: string }
      icon_url: { type: string }
      category: { type: enum, values: [wins, streaks, creativity, social, special] }
      requirement: { type: json }  # Conditions to unlock
      points: { type: int, default: 10 }
      is_hidden: { type: bool, default: false }  # Hidden until unlocked

  PlayerAchievement:
    description: "Achievement unlocked by a player"
    fields:
      id: { type: uuid, primary: true }
      unlocked_at: { type: datetime, auto: create }
    relations:
      player: { type: belongsTo, model: Player }
      achievement: { type: belongsTo, model: Achievement }

  MatchHistory:
    description: "Detailed match history for replay and analysis"
    fields:
      id: { type: uuid, primary: true }
      replay_data: { type: json }  # Full match state history
      highlights: { type: json, optional: true }  # Notable moments
      views: { type: int, default: 0 }
      is_featured: { type: bool, default: false }
      created_at: { type: datetime, auto: create }
    relations:
      match: { type: belongsTo, model: Match }
    indexes:
      - [is_featured]
      - [views]

  DailyChallenge:
    description: "Daily challenge for rewards"
    fields:
      id: { type: uuid, primary: true }
      date: { type: datetime }
      challenge_type: { type: enum, values: [win_streak, style_points, specific_prompt, puzzle_speed] }
      requirements: { type: json }
      rewards: { type: json }
      is_active: { type: bool, default: true }
    indexes:
      - [date]
      - [is_active]

  DailyChallengeProgress:
    description: "Player progress on daily challenge"
    fields:
      id: { type: uuid, primary: true }
      status: { type: enum, values: [in_progress, completed, claimed, expired], default: in_progress }
      progress: { type: json }
      completed_at: { type: datetime, optional: true }
      claimed_at: { type: datetime, optional: true }
    relations:
      challenge: { type: belongsTo, model: DailyChallenge }
      player: { type: belongsTo, model: Player }

    # =========================================================================
    # STATE MACHINE - Challenge Progress Lifecycle
    # =========================================================================
    state_machine:
      field: status
      initial: in_progress

      states:
        in_progress:
          description: "Player is working on the challenge"

        completed:
          description: "Challenge requirements met, reward available"
          on_enter: |
            set completed_at = now()
            emit daily_challenge.completed

        claimed:
          description: "Reward has been claimed"
          final: true
          on_enter: "set claimed_at = now()"

        expired:
          description: "Challenge day passed without completion"
          final: true

      transitions:
        complete:
          description: "Mark challenge as completed"
          from: in_progress
          to: completed
          guard: "meets_requirements(progress, challenge.requirements)"
          auto: true
          action: |
            notify_player_challenge_complete()

        claim_reward:
          description: "Claim the completion reward"
          from: completed
          to: claimed
          roles: [player]
          action: |
            grant_rewards(challenge.rewards, player)
            emit reward.claimed

        expire:
          description: "Challenge expired without completion"
          from: in_progress
          to: expired
          guard: "now() > challenge.date + interval '1 day'"
          auto: true

    # =========================================================================
    # COMPUTED FIELDS
    # =========================================================================
    computed:
      is_completed:
        type: bool
        virtual: true
        formula: "status in ['completed', 'claimed']"

      reward_claimed:
        type: bool
        virtual: true
        formula: "status == 'claimed'"

      completion_percentage:
        type: float
        virtual: true
        formula: "calculate_progress_percentage(progress, challenge.requirements)"

      can_claim:
        type: bool
        virtual: true
        formula: "status == 'completed'"

    # =========================================================================
    # BUSINESS RULES
    # =========================================================================
    constraints:
      - name: one_progress_per_challenge
        check: |
          not exists(DailyChallengeProgress, p =>
            p.id != id
            and p.player_id == player_id
            and p.challenge_id == challenge_id
          )
        message: "Player already has progress for this challenge"

    hooks:
      after_update:
        - name: check_completion
          when: "progress changed"
          action: |
            if meets_requirements(progress, challenge.requirements):
              transition to completed

# =============================================================================
# ENDPOINTS
# =============================================================================

endpoints:
  # --- Leaderboard ---
  /leaderboard:
    GET:
      name: getLeaderboard
      description: "Get current season leaderboard"
      auth: required
      query:
        season_id: { type: uuid, optional: true }  # Current season if not specified
        tier: { type: enum, values: [bronze, silver, gold, platinum, diamond, master, grandmaster], optional: true }
        page: { type: int, default: 1 }
        limit: { type: int, default: 50, max: 100 }
      response:
        200: { type: PaginatedResponse<LeaderboardEntry> }

  /leaderboard/me:
    GET:
      name: getMyRanking
      description: "Get current player's ranking"
      auth: required
      response:
        200: { type: LeaderboardEntry }
        404: { type: ErrorResponse }

  /leaderboard/around-me:
    GET:
      name: getPlayersAroundMe
      description: "Get players ranked around current player"
      auth: required
      query:
        range: { type: int, default: 5 }  # Players above and below
      response:
        200: { type: list<LeaderboardEntry> }

  # --- Seasons ---
  /seasons:
    GET:
      name: listSeasons
      description: "Get all seasons"
      auth: required
      response:
        200: { type: list<Season> }

  /seasons/current:
    GET:
      name: getCurrentSeason
      description: "Get current active season"
      auth: required
      response:
        200: { type: Season }

  # --- Friends ---
  /friends:
    GET:
      name: listFriends
      description: "Get player's friends list"
      auth: required
      query:
        status: { type: enum, values: [pending, accepted], optional: true }
      response:
        200: { type: list<Friendship> }

    POST:
      name: sendFriendRequest
      description: "Send a friend request"
      auth: required
      body: FriendRequestBody
      response:
        201: { type: Friendship }
        400: { type: ErrorResponse }

  /friends/{id}:
    params:
      id: { type: uuid }
    PATCH:
      name: respondToFriendRequest
      description: "Accept or reject friend request"
      auth: required
      body: FriendResponseBody
      response:
        200: { type: Friendship }

    DELETE:
      name: removeFriend
      description: "Remove a friend or cancel request"
      auth: required
      response:
        204: {}

  /friends/online:
    GET:
      name: getOnlineFriends
      description: "Get friends who are currently online"
      auth: required
      response:
        200: { type: list<Player> }

  # --- Spectating ---
  /spectate:
    GET:
      name: listSpectableMatches
      description: "Get matches available for spectating"
      auth: required
      query:
        mode: { type: enum, values: [ranked, casual, arena], optional: true }
        featured: { type: bool, optional: true }
      response:
        200: { type: list<Match> }

  /spectate/{match_id}:
    params:
      match_id: { type: uuid }
    POST:
      name: startSpectating
      description: "Start spectating a match"
      auth: required
      response:
        200: { type: SpectatorSession }

    DELETE:
      name: stopSpectating
      description: "Stop spectating a match"
      auth: required
      response:
        204: {}

  /spectate/{match_id}/count:
    params:
      match_id: { type: uuid }
    GET:
      name: getSpectatorCount
      description: "Get number of spectators for a match"
      auth: optional
      response:
        200: { type: json }

  # --- Achievements ---
  /achievements:
    GET:
      name: listAchievements
      description: "Get all available achievements"
      auth: required
      query:
        category: { type: enum, values: [wins, streaks, creativity, social, special], optional: true }
      response:
        200: { type: list<Achievement> }

  /achievements/me:
    GET:
      name: getMyAchievements
      description: "Get player's unlocked achievements"
      auth: required
      response:
        200: { type: list<PlayerAchievement> }

  # --- Match History / Replays ---
  /replays:
    GET:
      name: listReplays
      description: "Get match replays"
      auth: required
      query:
        featured: { type: bool, optional: true }
        player_id: { type: uuid, optional: true }
        limit: { type: int, default: 20 }
      response:
        200: { type: list<MatchHistory> }

  /replays/{id}:
    params:
      id: { type: uuid }
    GET:
      name: getReplay
      description: "Get replay data for a match"
      auth: required
      response:
        200: { type: MatchHistory }

  # --- Daily Challenges ---
  /challenges/daily:
    GET:
      name: getDailyChallenge
      description: "Get today's daily challenge"
      auth: required
      response:
        200: { type: DailyChallenge }

  /challenges/daily/progress:
    GET:
      name: getDailyChallengeProgress
      description: "Get player's progress on daily challenge"
      auth: required
      response:
        200: { type: DailyChallengeProgress }

  /challenges/daily/claim:
    POST:
      name: claimDailyReward
      description: "Claim reward for completed daily challenge"
      auth: required
      response:
        200: { type: json }
        400: { type: ErrorResponse }

# =============================================================================
# STREAMS - Real-time updates
# =============================================================================

streams:
  /spectate/{match_id}/live:
    name: spectatorStream
    description: "Real-time match updates for spectators (delayed prompts)"
    type: websocket
    auth: required
    params:
      match_id: { type: uuid }
    chunks:
      event_type: { type: enum, values: [phase_change, execution, round_end, match_end, chat] }
      round_number: { type: int, optional: true }
      arena_state: { type: json, optional: true }
      # Prompts are revealed with delay for spectators
      prompts_revealed: { type: json, optional: true }
      executor_action: { type: string, optional: true }
      scores: { type: json, optional: true }
      spectator_count: { type: int, optional: true }

  /friends/presence:
    name: friendsPresenceStream
    description: "Real-time friend online/offline status"
    type: websocket
    auth: required
    chunks:
      event_type: { type: enum, values: [online, offline, in_match, idle] }
      friend_id: { type: uuid }
      status: { type: string }
      match_id: { type: uuid, optional: true }  # If they're in a match

  /leaderboard/live:
    name: leaderboardLiveStream
    description: "Real-time leaderboard updates"
    type: sse
    auth: required
    chunks:
      event_type: { type: enum, values: [rank_change, new_entry, tier_promotion] }
      player_id: { type: uuid }
      old_rank: { type: int, optional: true }
      new_rank: { type: int }
      tier: { type: string, optional: true }

# =============================================================================
# EVENTS - Social events
# =============================================================================

events:
  season.started:
    description: "A new season has started"
    payload:
      season_id: uuid
      season_name: string
      start_date: datetime
      end_date: datetime
    channels: [redis-pubsub, push]

  season.ended:
    description: "Season has ended"
    payload:
      season_id: uuid
      season_name: string
      top_players: json
    channels: [redis-pubsub, push]

  achievement.unlocked:
    description: "Player unlocked an achievement"
    payload:
      player_id: uuid
      achievement_id: uuid
      achievement_name: string
      points: int
    channels: [websocket, push]

  tier.promoted:
    description: "Player promoted to higher tier"
    payload:
      player_id: uuid
      old_tier: string
      new_tier: string
    channels: [websocket, push]

  friend.request_received:
    description: "Player received a friend request"
    payload:
      requester_id: uuid
      requester_name: string
    channels: [websocket, push]

  friend.request_accepted:
    description: "Friend request was accepted"
    payload:
      friend_id: uuid
      friend_name: string
    channels: [websocket, push]

  daily_challenge.completed:
    description: "Player completed daily challenge"
    payload:
      player_id: uuid
      challenge_id: uuid
      rewards: json
    channels: [websocket]

# =============================================================================
# JOBS - Background tasks
# =============================================================================

jobs:
  calculate_daily_rankings:
    description: "Update leaderboards and rankings"
    schedule: "0 0 * * *"  # Daily at midnight
    timeout: 600
    retry:
      max_attempts: 3
      backoff: exponential

  generate_daily_challenges:
    description: "Create new daily challenges"
    schedule: "0 0 * * *"  # Daily at midnight
    timeout: 120

  process_season_end:
    description: "Process season end, distribute rewards"
    schedule: "0 0 1 * *"  # First of each month
    timeout: 1800

  update_tier_rankings:
    description: "Promote/demote players based on ELO"
    schedule: "0 */6 * * *"  # Every 6 hours
    timeout: 300

  cleanup_spectator_sessions:
    description: "Clean up abandoned spectator sessions"
    schedule: "*/5 * * * *"  # Every 5 minutes
    timeout: 60

  check_achievements:
    description: "Check and unlock achievements for players"
    schedule: "*/10 * * * *"  # Every 10 minutes
    timeout: 300

  feature_top_matches:
    description: "Select and feature interesting matches for replay"
    schedule: "0 */4 * * *"  # Every 4 hours
    timeout: 300
