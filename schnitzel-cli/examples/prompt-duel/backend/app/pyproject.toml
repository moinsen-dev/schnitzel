[project]
name = "prompt_duel-backend"
version = "0.1.0"
description = "FastAPI backend for prompt-duel"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "prometheus-client>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
