# Auth feature schema with User and Session models
schnitzel: 1.0.0

models:
  User:
    fields:
      id:
        type: uuid
        primary: true
      email:
        type: string
        unique: true
      created_at:
        type: datetime
        auto: create
  Session:
    fields:
      id:
        type: uuid
        primary: true
      user_id:
        type: uuid
      token:
        type: string
      expires_at:
        type: datetime
    relations:
      user:
        type: belongsTo
        model: User
        foreign_key: user_id
