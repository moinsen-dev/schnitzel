# Posts feature schema with Post and Comment models
schnitzel: 1.0.0

models:
  Post:
    fields:
      id:
        type: uuid
        primary: true
      title:
        type: string
      content:
        type: string
      author_id:
        type: uuid
      created_at:
        type: datetime
        auto: create
    relations:
      author:
        type: belongsTo
        model: User
        foreign_key: author_id
      comments:
        type: hasMany
        model: Comment
  Comment:
    fields:
      id:
        type: uuid
        primary: true
      post_id:
        type: uuid
      author_id:
        type: uuid
      text:
        type: string
      created_at:
        type: datetime
        auto: create
    relations:
      post:
        type: belongsTo
        model: Post
        foreign_key: post_id
      author:
        type: belongsTo
        model: User
        foreign_key: author_id
